name: Build Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-22.04
            artifact: linux-x86_64
            cgo: 0
          - goos: linux
            goarch: arm64
            os: ubuntu-22.04-arm
            artifact: linux-arm64
            cgo: 0
          - goos: darwin
            goarch: arm64
            os: macos-14
            artifact: darwin-arm64
            cgo: 1
          - goos: darwin
            goarch: amd64
            os: macos-14
            artifact: darwin-x86_64
            cgo: 1
          - goos: windows
            goarch: amd64
            os: windows-2022
            artifact: windows-x64
            cgo: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm build:web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        shell: bash
        run: |
          cd server
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ matrix.cgo }} go build -ldflags="-s -w" -o lansend .
          cd ..

      - name: Package (Linux/macOS)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          cp server/lansend lansend
          tar czf lansend-${{ matrix.artifact }}.tar.gz lansend

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          cp server/lansend.exe lansend.exe
          7z a lansend-${{ matrix.artifact }}.zip lansend.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lansend-${{ matrix.artifact }}
          path: |
            lansend-*.tar.gz
            lansend-*.zip

  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Flatten assets
        shell: bash
        run: find assets -type f -exec mv {} . \;

      - name: Generate checksums
        shell: bash
        run: shasum -a 256 lansend-*.tar.gz lansend-*.zip > checksums.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            lansend-*.tar.gz
            lansend-*.zip
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
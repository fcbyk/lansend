name: Build Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  cli:
    name: cli-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-22.04
            artifact: linux-x86_64
            cgo: 0
          - goos: linux
            goarch: arm64
            os: ubuntu-22.04-arm
            artifact: linux-arm64
            cgo: 0
          # macos-14 的支持已在 2026-11 结束，统一升到 macos-15
          - goos: darwin
            goarch: arm64
            os: macos-15
            artifact: darwin-arm64
            cgo: 0
          - goos: darwin
            goarch: amd64
            os: macos-15
            artifact: darwin-x86_64
            cgo: 0
          - goos: windows
            goarch: amd64
            os: windows-2022
            artifact: windows-x64
            cgo: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm build:web
        shell: bash

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        shell: bash
        run: |
          # 版本号唯一来源是 package.json；标签名只用来校验，两边不一致就停下，
          # 否则会发布出「标签 v2026.11.4、二进制自称 2026.11.6」的东西。
          VERSION=v$(node -p "require('./package.json').version")
          if [ "${VERSION}" != "${{ github.ref_name }}" ]; then
            echo "package.json 版本 ${VERSION} 与标签 ${{ github.ref_name }} 不一致" >&2
            exit 1
          fi
          BIN=lansend
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN=lansend.exe; fi
          cd server
          HASH=$(git rev-parse --short HEAD)
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ matrix.cgo }} go build -ldflags="-s -w -X 'main.version=${VERSION}' -X 'main.commitHash=${HASH}'" -o ../$BIN ./cmd/lansend

      - name: Package (Linux/macOS)
        if: matrix.goos != 'windows'
        shell: bash
        run: tar czf lansend-${{ matrix.artifact }}.tar.gz lansend

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: 7z a lansend-${{ matrix.artifact }}.zip lansend.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lansend-${{ matrix.artifact }}
          path: |
            lansend-*.tar.gz
            lansend-*.zip

  desktop:
    name: desktop-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 只发 Windows x86 与 macOS 两个架构。Linux 不发：Wails 的 GTK 后端仍标着
          # 实验性，托盘依赖桌面环境提供 StatusNotifier 宿主，关窗即隐藏的行为没法保证。
          # 两个 macOS 目标都用原生 runner，避免 cgo 交叉编译（GitHub 已不提供 macOS 13，
          # Intel 走 2025 年新增的 macos-15-intel 标签）。
          - os: windows-2022
            artifact: windows-x64
            script: pnpm build:desktop
          - os: macos-15
            artifact: darwin-arm64
            script: pnpm build:desktop:mac
          - os: macos-15-intel
            artifact: darwin-x86_64
            script: pnpm build:desktop:mac

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        shell: bash
        run: |
          # 与 CLI 同一条规则：版本来自 package.json，且必须和标签一致
          VERSION=v$(node -p "require('./package.json').version")
          if [ "${VERSION}" != "${{ github.ref_name }}" ]; then
            echo "package.json 版本 ${VERSION} 与标签 ${{ github.ref_name }} 不一致" >&2
            exit 1
          fi
          ${{ matrix.script }}

      # 跑完 pnpm build:desktop 才会生成 build/lansend-desktop.exe；
      # 构建脚本还会用当前版本重新生成 PE 资源（图标 + 版本信息），无需额外步骤。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cd build && 7z a ../lansend-desktop-${{ matrix.artifact }}.zip lansend-desktop.exe

      # .app 是目录，必须用 ditto 打包：普通 zip 会丢掉符号链接和扩展属性，
      # 解压出来的包可能直接打不开。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build/LANSend.app lansend-desktop-${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lansend-desktop-${{ matrix.artifact }}
          path: lansend-desktop-*.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    # 桌面端构建失败就不发版，避免出现只带 CLI 的半套发布
    needs: [cli, desktop]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Flatten assets
        shell: bash
        run: find assets -type f -exec mv {} . \;

      - name: Generate checksums
        shell: bash
        run: shasum -a 256 lansend-*.tar.gz lansend-*.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            lansend-*.tar.gz
            lansend-*.zip
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

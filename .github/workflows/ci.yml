name: CI

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-22.04
            artifact: linux-x86_64
            cgo: 0
          - goos: linux
            goarch: arm64
            os: ubuntu-22.04-arm
            artifact: linux-arm64
            cgo: 0
          - goos: darwin
            goarch: arm64
            os: macos-15
            artifact: darwin-arm64
            cgo: 0
          - goos: darwin
            goarch: amd64
            os: macos-15
            artifact: darwin-x86_64
            cgo: 0
          - goos: windows
            goarch: amd64
            os: windows-2022
            artifact: windows-x64
            cgo: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm build:web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        shell: bash
        run: |
          # 和本地构建读同一个来源，别再按构建日期现算
          VERSION=v$(node -p "require('./package.json').version")
          BIN=lansend
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN=lansend.exe; fi
          cd server
          HASH=$(git rev-parse --short HEAD)
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ matrix.cgo }} go build -ldflags="-s -w -X 'main.version=${VERSION}' -X 'main.commitHash=${HASH}'" -o ../$BIN ./cmd/lansend

      - name: Package (Linux/macOS)
        if: matrix.goos != 'windows'
        shell: bash
        run: tar czf lansend-${{ matrix.artifact }}.tar.gz lansend

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: 7z a lansend-${{ matrix.artifact }}.zip lansend.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lansend-${{ matrix.artifact }}
          path: |
            lansend-*.tar.gz
            lansend-*.zip
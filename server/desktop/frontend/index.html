<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lansend</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "@wailsio/runtime": "/wails/runtime.js"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <section class="status">
      <span id="status" class="badge">连接中…</span>
      <span id="hint" class="hint"></span>
    </section>

    <section class="field">
      <label for="directory">共享目录</label>
      <div class="combo">
        <input id="directory" type="text" readonly />
        <button id="pick" class="combo-btn" type="button">选择</button>
      </div>
    </section>

    <section class="field">
      <label for="port">端口</label>
      <input id="port" type="number" min="1" max="65535" step="1" inputmode="numeric" />
    </section>

    <section class="field">
      <span class="label">功能</span>
      <div class="pills">
        <label class="pill">
          <input id="download" type="checkbox" />
          <span>下载</span>
        </label>
        <label class="pill">
          <input id="upload" type="checkbox" />
          <span>上传</span>
        </label>
        <label class="pill">
          <input id="chat" type="checkbox" />
          <span>聊天</span>
        </label>
      </div>
    </section>

    <section class="addresses">
      <div class="section-head">
        <span class="label">访问地址</span>
      </div>
      <ul id="urls" class="urls">
        <li class="empty">服务未启动</li>
      </ul>
    </section>

    <section class="footer">
      <p id="error" class="error" hidden></p>
      <button id="toggle" class="btn primary block" type="button">启动服务</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
